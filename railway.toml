[build]
buildCommand = "echo 'Using Dockerfile'"

# Runs once per deploy before traffic switches (requires DATABASE_URL on the service).
[deploy]
releaseCommand = "npx prisma migrate deploy"

# ── Consolidated Cron Scheduler ───────────────────────────────────────────────
# One always-on Railway service runs all scheduled jobs.
# Service name: cron-scheduler
# Start command: node cron/scheduler.mjs
# Env vars: BASE_URL=https://courtpass.thecourtflow.com, CRON_SECRET
#
# Internal schedule (all handled by cron/scheduler.mjs):
#   expire-holds         every minute   — deletes expired booking/open-play holds
#   auto-close-sessions  every hour     — closes sessions open > 6 hours
#   open-bill-aging      daily 02:00    — auto-issues open bills, marks overdue
#   generate-invoices    Mon 00:01      — generates weekly/monthly billing invoices
